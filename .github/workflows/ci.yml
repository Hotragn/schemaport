name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        # Path handling and file encoding differ enough on Windows and macOS to
        # be worth one run each rather than a full matrix.
        include:
          - python-version: "3.13"
            os: windows-latest
          - python-version: "3.13"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Check the CLI works against the shipped examples
        shell: bash
        run: |
          # Exit 1 is expected: both examples carry findings on purpose. Exit 2
          # would mean the request could not be checked at all, which is a real
          # failure.
          set -euo pipefail
          for spec in \
            "examples/requests/anthropic-cached-agent-turn.json claude-sonnet-5" \
            "examples/requests/openai-structured-output.json gpt-5.6-sol"
          do
            set -- $spec
            status=0
            schemaport check "$1" --model "$2" --format json > /dev/null || status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::schemaport could not check $1"
              exit 1
            fi
          done

  offline:
    name: no network access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite in a network namespace with no route out
        # The offline guarantee is load-bearing for the sandboxed and air-gapped
        # environments this tool targets, so it is enforced here rather than
        # trusted.
        #
        # The isolation is a private network namespace, not a machine-wide
        # firewall rule. Dropping egress for the whole runner also severs the
        # Actions agent's own link back to GitHub, so the job cannot report a
        # result and hangs until the timeout instead of failing. Unsharing the
        # namespace takes the network away from the test process alone.
        #
        # Invoked through `python -m` because sudo resets PATH via secure_path,
        # so the console script would not be found.
        run: |
          cat > /tmp/offline-check.sh <<'SH'
          set -euo pipefail

          # Loopback starts down in a fresh namespace. Nothing here needs it,
          # but leaving it down would turn an unrelated bug into a confusing one.
          ip link set lo up

          "$PYTHON_BIN" -m pytest

          status=0
          "$PYTHON_BIN" -m schemaport check \
            examples/requests/anthropic-cached-agent-turn.json \
            --model claude-sonnet-5 --format json > /dev/null || status=$?
          # 1 means findings, which is what this example is supposed to produce.
          [ "$status" -eq 1 ]
          SH
          sudo PYTHON_BIN="$(which python)" unshare --net -- bash /tmp/offline-check.sh

      - name: Confirm the namespace really had no route out
        # A guarantee enforced by a broken harness is worse than no guarantee,
        # so prove the isolation works before trusting the step above.
        run: |
          if sudo unshare --net -- bash -c 'ip link set lo up; \
            timeout 10 getent hosts pypi.org' 2>/dev/null; then
            echo "::error::DNS resolved inside the namespace; the isolation is not working"
            exit 1
          fi
          echo "confirmed: no name resolution inside the namespace"

  package:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Metadata check
        run: python -m twine check dist/*

      - name: Confirm the contract dataset ships inside the wheel
        # A wheel that builds cleanly but drops the JSON installs fine and then
        # fails on first use, so assert the files are present rather than
        # assuming the build backend picked them up.
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {"schemaport/data/dataset.json", "schemaport/py.typed"}
          missing = required - names
          profiles = [n for n in names if n.startswith("schemaport/data/profiles/")]
          rule_sets = [n for n in names if n.startswith("schemaport/data/rule-sets/")]
          if missing or not profiles or not rule_sets:
              print(f"missing from wheel: {missing or 'none'}")
              print(f"profiles: {len(profiles)}, rule sets: {len(rule_sets)}")
              sys.exit(1)
          print(f"{wheel}: {len(profiles)} profiles, {len(rule_sets)} rule sets")
          PY

      - name: Install the wheel clean and smoke-test it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/check/bin/schemaport --version
          /tmp/check/bin/schemaport profiles

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

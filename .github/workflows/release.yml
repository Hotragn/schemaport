name: Release

# Publishing is gated on a version tag, and the artifacts that reach PyPI are
# the same files that were built and tested here — never a rebuild. Once a file
# is uploaded to PyPI it cannot be replaced.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"

      - name: Full gate
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest

      - name: Build
        run: python -m build

      - name: Metadata check
        run: python -m twine check dist/*

      - name: Confirm the tag matches the package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, sys

          source = pathlib.Path("src/schemaport/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              sys.exit("could not read __version__")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              sys.exit(f"tag {tag!r} does not match package version {version!r}")
          print(f"version={version}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/schemaport
    permissions:
      # Trusted Publishing: a short-lived OIDC token, no stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    name: install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the published artifact and run it
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "schemaport==${{ needs.build.outputs.version }}"; then
              break
            fi
            echo "TestPyPI index not ready yet; retrying in 30s"
            sleep 30
          done
          schemaport --version
          schemaport profiles

  pypi:
    name: publish to PyPI
    needs: [build, testpypi, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/schemaport
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # The same files the earlier jobs verified. No rebuild.
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

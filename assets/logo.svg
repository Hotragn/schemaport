<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Schemaport">
  <title>Schemaport</title>

  <!-- The mark is a request passing through a checkpoint: braces for the JSON
       body, a gate down the middle for the boundary it has to clear. Two
       colours and no gradients, so it stays legible at favicon size. -->

  <rect width="128" height="128" rx="28" fill="#0F172A"/>

  <g fill="none" stroke="#E2E8F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- { -->
    <path d="M44 30c-9 0-11 5-11 12v10c0 7-4 10-9 10 5 0 9 3 9 10v10c0 7 2 12 11 12"/>
    <!-- } -->
    <path d="M84 30c9 0 11 5 11 12v10c0 7 4 10 9 10-5 0-9 3-9 10v10c0 7-2 12-11 12"/>
  </g>

  <!-- The gate: a broken vertical line, open in the middle where the check
       happens. -->
  <g stroke="#38BDF8" stroke-width="8" stroke-linecap="round">
    <path d="M64 26v22"/>
    <path d="M64 80v22"/>
  </g>

  <!-- Cleared. -->
  <path d="M54 63.5l7.5 8L75 57" fill="none" stroke="#38BDF8" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
